<div id="app-root"></div>
<style>
  :root {
    --paper: #FFFFFF;
    --panel: #F4F4F4;
    --ink: #0B4A3E;
    --ink-soft: #6B8681;
    --teal: #1B7A74;
    --teal-dark: #0B4A3E;
    --gold: #F2A81E;
    --line: #E1E1E1;
    --yellow-light: #F9F1CE;
    --yellow-border: #DECD86;
  }

  * { box-sizing: border-box; }

  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type=number] {
    -moz-appearance: textfield;
    appearance: textfield;
  }

  #app-root {
    font-family: 'Calibri Light', Calibri, 'Segoe UI', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 36px 24px;
    min-height: 100%;
    font-size: 16px;
  }

  .field input[type="text"],
  .field input[type="number"],
  .field input[type="date"],
  .field textarea {
    background: var(--yellow-light) !important;
    border: 1px solid var(--yellow-border) !important;
    border-radius: 6px !important;
  }

  .field input[type="text"],
  .field input[type="number"],
  .field input[type="date"] {
    padding: 6px 8px !important;
  }

  .field input:focus, .field textarea:focus {
    background: #fff !important;
    border-color: var(--teal) !important;
  }

  .field.lookup-field input[type="text"],
  .field.lookup-field input[type="number"] {
    background: #EDF1F3 !important;
    border: 1px dashed var(--ink-soft) !important;
    color: var(--ink-soft) !important;
  }
  .field.lookup-field input:focus {
    background: #fff !important;
    border-color: var(--teal) !important;
    color: var(--ink) !important;
  }
  .field.lookup-field .lookup-tag {
    color: var(--ink-soft);
    font-style: italic;
  }

  .cif-each-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    margin-top: 6px;
    background: var(--panel);
    border-radius: 6px;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .cif-each-line b { color: var(--ink); font-size: 16px; }

  .guardrail-box {
    border: 2px solid var(--teal);
    border-radius: 10px;
    padding: 16px 18px 6px;
    margin-top: 8px;
    background: rgba(27,122,116,0.05);
  }
  .guardrail-heading {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 6px;
  }
  .guardrail-box .field { border-bottom-color: rgba(27,122,116,0.2); }
  .guardrail-box .discount-slider-row { margin-bottom: 10px; }
  .subgroup-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 4px;
  }

  .discount-box {
    border: 2px solid var(--gold);
    border-radius: 10px;
    padding: 16px 18px;
    margin-top: 14px;
    background: rgba(242,168,30,0.07);
    text-align: center;
  }
  .discount-box-label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #9C6E10;
    margin-bottom: 8px;
  }
  .discount-box-input {
    width: 100px;
    font-family: inherit;
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    color: var(--ink);
    background: var(--yellow-light) !important;
    border: 1px solid var(--yellow-border) !important;
    border-radius: 8px !important;
    padding: 6px !important;
  }
  .discount-box-hint {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 8px;
  }

  .board { max-width: 1080px; margin: 0 auto; }

  .board-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 28px;
  }

  .board-title {
    font-size: 30px;
    font-weight: 600;
    color: var(--ink);
  }

  .board-sub {
    font-size: 13px;
    color: var(--ink-soft);
  }

  .layout {
    display: grid;
    grid-template-columns: 0.85fr 1.15fr;
    gap: 24px;
    align-items: start;
  }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ---- INPUT PANEL ---- */
  .panel {
    background: var(--panel);
    border-radius: 12px;
    padding: 24px;
  }

  .panel-label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 20px 0 8px;
  }
  .panel-label:first-child { margin-top: 0; }

  .field {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }

  .field label { font-size: 15px; color: var(--ink); }
  .field .lookup-tag { font-size: 11px; color: var(--teal); margin-left: 6px; }
  .field .hint { font-size: 11px; color: var(--ink-soft); display: block; }

  .field input[type="text"],
  .field input[type="number"],
  .field input[type="date"] {
    font-family: inherit;
    font-size: 16px;
    color: var(--ink);
    background: transparent;
    border: none;
    text-align: right;
    padding: 4px;
    width: 130px;
  }
  .field input:focus { outline: none; background: #fff; border-radius: 4px; }
  .field.wide { display: block; }
  .field.wide input[type="text"] { width: 100%; text-align: left; margin-top: 4px; font-size: 17px; }

  .field textarea {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px;
    resize: vertical;
    min-height: 44px;
    color: var(--ink);
    margin-top: 6px;
  }

  .discount-slider-row { margin-top: 4px; }
  .discount-slider-label {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .discount-slider-label .val { font-size: 22px; color: var(--teal); }
  input[type="range"] { width: 100%; accent-color: var(--teal); height: 24px; }

  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    padding: 4px 0;
  }
  .status-row label { font-size: 15px; font-weight: 600; color: var(--ink); }
  .status-select {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 8px;
    border: 2px solid var(--line);
    cursor: pointer;
  }
  .status-select.status-active { background: rgba(27,122,116,0.12); border-color: var(--teal); color: var(--teal); }
  .status-select.status-pending { background: rgba(242,168,30,0.12); border-color: var(--gold); color: #9C6E10; }
  .status-select.status-inactive { background: #EFEFEF; border-color: var(--ink-soft); color: var(--ink-soft); }

  .push-btn {
    width: 100%;
    margin-top: 20px;
    padding: 16px;
    background: var(--teal-dark);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
  }
  .push-btn:hover { background: var(--teal); }

  .demo-note { margin-top: 10px; font-size: 12px; color: var(--ink-soft); text-align: center; }

  /* ---- RESULT PANEL ---- */
  .hero {
    background: var(--teal-dark);
    color: #fff;
    border-radius: 12px;
    padding: 28px 28px 24px;
  }

  .hero-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .hero-item-name {
    font-size: 22px;
    font-weight: 600;
  }
  .hero-item-no {
    font-size: 13px;
    opacity: 0.75;
  }

  .discount-badge {
    background: var(--gold);
    color: var(--teal-dark);
    font-size: 16px;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 999px;
  }

  .hero-status-badge {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 999px;
  }
  .hero-status-badge.status-active { background: #7FE0C9; color: var(--teal-dark); }
  .hero-status-badge.status-pending { background: var(--gold); color: var(--teal-dark); }
  .hero-status-badge.status-inactive { background: rgba(255,255,255,0.2); color: #fff; }

  .price-block {
    text-align: center;
    margin: 22px 0 8px;
  }
  .price-was {
    font-size: 20px;
    opacity: 0.65;
    text-decoration: line-through;
    margin-right: 10px;
  }
  .price-now {
    font-size: 64px;
    font-weight: 700;
    line-height: 1;
  }
  .price-each-label {
    font-size: 13px;
    opacity: 0.7;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .market-pill-row { text-align: center; margin-top: 10px; margin-bottom: 0; }
  .market-pill {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.15);
  }

  .margin-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 20px;
  }

  .margin-col { text-align: center; }
  .margin-col-label {
    font-size: 13px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    opacity: 0.75;
    margin-bottom: 6px;
  }
  .margin-col-value {
    font-size: 40px;
    font-weight: 700;
    line-height: 1;
  }
  .margin-delta {
    margin-top: 8px;
    font-size: 16px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .margin-delta.up { color: #7FE0C9; }
  .margin-delta.down { color: var(--gold); }
  .margin-delta.flat { color: rgba(255,255,255,0.6); }

  .srp-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 20px;
    margin-top: 14px;
  }

  .case-strip {
    margin-top: 18px;
    background: var(--panel);
    border-radius: 10px;
    padding: 16px 20px;
  }
  .case-strip-label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .case-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .case-metric { text-align: center; }
  .case-metric-label { font-size: 11px; letter-spacing: 0.3px; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 2px; }
  .case-metric-value { font-size: 19px; font-weight: 600; color: var(--ink); }

  .flag-row {
    margin-top: 14px;
    font-size: 14px;
    color: var(--gold);
    font-weight: 600;
  }
</style>

<script>
(function () {
  // Token lives server-side now, in Netlify env vars — never in this file.
  // Notion is only touched when Push to Notion is clicked — no live pull on load.

  async function pushToNotion(payload) {
    const res = await fetch("/api/push-discount", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error(`Push failed: ${res.status} ${await res.text()}`);
    return await res.json();
  }

  const state = {
    itemNo: "TF-2214",
    itemName: "Fresh Mango",
    itemsPerCase: "12",
    wholesalePrice: "18.50",

    cost: "134.40",
    weight: "22",
    freight: "3.30", // auto = weight * FREIGHT_RATE, editable override
    marketLow: "14.00",
    marketHigh: "17.50",
    discountPct: "12",
    srp: "21.00",
    availableFor: "All Tany distribution accounts, HEB and Fiesta excluded",
    note: "Q3 promo push — overstock clearance",
    startDate: "2026-08-01",
    endDate: "2026-08-14",
    status: "Pending",
    pushStatus: "", // "", "loading", "success", "error"
    pushMessage: "",
  };

  const FREIGHT_RATE = 0.15;

  function calc() {
    const wholesalePrice = parseFloat(state.wholesalePrice) || 0;
    const cost = parseFloat(state.cost) || 0;
    const freight = parseFloat(state.freight) || 0;
    const itemsPerCase = parseInt(state.itemsPerCase) || 1;
    const marketLow = parseFloat(state.marketLow) || 0;
    const marketHigh = parseFloat(state.marketHigh) || 0;
    const discountPct = parseFloat(state.discountPct) || 0;
    const srp = parseFloat(state.srp) || 0;

    const landedCostCase = freight + cost;
    const cifEa = itemsPerCase ? landedCostCase / itemsPerCase : 0;

    const margin = wholesalePrice ? 1 - (cifEa / wholesalePrice) : 0;
    const discountedPrice = wholesalePrice * (1 - discountPct / 100);
    const resultingMargin = discountedPrice ? 1 - (cifEa / discountedPrice) : 0;
    const srpMargin = srp ? 1 - (wholesalePrice / srp) : 0;
    const deltaPoints = (resultingMargin - margin) * 100;

    let marketPosition = "within";
    if (srp < marketLow) marketPosition = "below";
    else if (srp > marketHigh) marketPosition = "above";

    const caseWholesale = wholesalePrice * itemsPerCase;
    const caseDiscounted = discountedPrice * itemsPerCase;

    return {
      wholesalePrice, cost, freight, itemsPerCase, marketLow, marketHigh, discountPct, srp,
      landedCostCase, cifEa, margin, discountedPrice, resultingMargin, srpMargin,
      deltaPoints, marketPosition, caseWholesale, caseDiscounted,
    };
  }

  const positionPillText = { within: "SRP Within Market", below: "SRP Below Market", above: "SRP Above Market" };

  function render() {
    const c = calc();
    const deltaDir = Math.abs(c.deltaPoints) < 0.05 ? "flat" : (c.deltaPoints > 0 ? "up" : "down");
    const arrow = deltaDir === "up" ? "▲" : deltaDir === "down" ? "▼" : "—";

    const flags = [];
    if (c.resultingMargin < 0.10) flags.push("Resulting margin under 10%");
    if (c.marketPosition === "below") flags.push("SRP undercuts market low");

    document.getElementById('app-root').innerHTML = `
      <div class="board">
        <div class="board-header">
          <div>
            <div class="board-title">Discount Check</div>
            <div class="board-sub">Tany Foods — Pricing Ticket</div>
          </div>
          <div class="board-sub">Notion connects only on Push</div>
        </div>

        <div class="layout">
          <div class="panel">
            <div class="panel-label">Item Details</div>
            <div class="field"><label>Item No.</label><input id="f-itemNo" type="text" value="${state.itemNo}" /></div>
            <div class="field"><label>Item Name</label><input id="f-itemName" type="text" value="${state.itemName}" /></div>
            <div class="field"><label># of Items</label><input id="f-itemsPerCase" type="text" inputmode="decimal" value="${state.itemsPerCase}" /></div>
            <div class="field"><label>Wholesale Price (EA)</label><input id="f-wholesalePrice" type="text" inputmode="decimal" value="${state.wholesalePrice}" /></div>

            <div class="panel-label">Case Inputs</div>
            <div class="field"><label>Cost (per case)</label><input id="f-cost" type="text" inputmode="decimal" value="${state.cost}" /></div>
            <div class="field"><label>Weight (lbs, per case)</label><input id="f-weight" type="text" inputmode="decimal" value="${state.weight}" /></div>
            <div class="field">
              <label>Freight (per case) <span class="hint">= weight × ${FREIGHT_RATE}, adjustable</span></label>
              <input id="f-freight" type="text" inputmode="decimal" value="${state.freight}" />
            </div>
            <div class="cif-each-line"><span>CIF Each <span style="opacity:0.7;">(Freight + Cost) ÷ # Items</span></span><b>$${c.cifEa.toFixed(2)}</b></div>

            <div class="discount-box">
              <div class="discount-box-label">Discount %</div>
              <input id="f-discount" type="text" inputmode="decimal" value="${state.discountPct}" class="discount-box-input" />
              <div class="discount-box-hint">See the impact live in the result card</div>
            </div>

            <div class="panel-label">Effective</div>
            <div class="field"><label>Effective start</label><input id="f-startDate" type="date" value="${state.startDate}" /></div>
            <div class="field"><label>Effective end</label><input id="f-endDate" type="date" value="${state.endDate}" /></div>

            <div class="panel-label">Details</div>
            <div class="field wide"><label>Available for</label><textarea id="f-availableFor">${state.availableFor}</textarea></div>
            <div class="field wide" style="margin-top:14px;"><label>Notes</label><textarea id="f-note">${state.note}</textarea></div>

            <div class="guardrail-box">
              <div class="subgroup-label">Market Retail Prices</div>
              <div class="field"><label>Market low</label><input id="f-marketLow" type="text" inputmode="decimal" value="${state.marketLow}" /></div>
              <div class="field"><label>Market high</label><input id="f-marketHigh" type="text" inputmode="decimal" value="${state.marketHigh}" /></div>
              <div class="field"><label>SRP</label><input id="f-srp" type="text" inputmode="decimal" value="${state.srp}" /></div>
            </div>
          </div>

          <div>
            <div class="hero">
              <div class="hero-top">
                <div>
                  <div class="hero-item-name">${state.itemName}</div>
                  <div class="hero-item-no">Item № ${state.itemNo || "—"}</div>
                </div>
                <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
                  <div class="discount-badge">${state.discountPct}% OFF</div>
                  <div class="hero-status-badge status-${state.status.toLowerCase()}">${state.status}</div>
                </div>
              </div>

              <div class="price-block">
                <div>
                  ${c.discountPct > 0 ? `<span class="price-was">$${c.wholesalePrice.toFixed(2)}</span>` : ""}
                  <span class="price-now">$${c.discountedPrice.toFixed(2)}</span>
                </div>
                <div class="price-each-label">final price · per each</div>
              </div>

              <div class="margin-grid">
                <div class="margin-col">
                  <div class="margin-col-label">Current Margin</div>
                  <div class="margin-col-value">${(c.margin * 100).toFixed(1)}%</div>
                </div>
                <div class="margin-col">
                  <div class="margin-col-label">Resulting Margin</div>
                  <div class="margin-col-value">${(c.resultingMargin * 100).toFixed(1)}%</div>
                  <div class="margin-delta ${deltaDir}">${arrow} ${Math.abs(c.deltaPoints).toFixed(1)} pts</div>
                </div>
              </div>

              <div class="srp-grid">
                <div class="margin-col">
                  <div class="margin-col-label">SRP Target</div>
                  <div class="margin-col-value">$${c.srp.toFixed(2)}</div>
                  <div class="market-pill-row">
                    <span class="market-pill">${positionPillText[c.marketPosition]}</span>
                  </div>
                </div>
                <div class="margin-col">
                  <div class="margin-col-label">SRP Margin</div>
                  <div class="margin-col-value">${(c.srpMargin * 100).toFixed(1)}%</div>
                </div>
              </div>

              ${flags.length > 0 ? `<div class="flag-row">${flags.join(" · ")}</div>` : ""}
            </div>

            <div class="case-strip">
              <div class="case-strip-label">By Case · ${state.itemsPerCase} units</div>
              <div class="case-grid">
                <div class="case-metric"><div class="case-metric-label">Case Cost</div><div class="case-metric-value">$${c.cost.toFixed(2)}</div></div>
                <div class="case-metric"><div class="case-metric-label">Case Freight</div><div class="case-metric-value">$${c.freight.toFixed(2)}</div></div>
                <div class="case-metric"><div class="case-metric-label">Case Landed</div><div class="case-metric-value">$${c.landedCostCase.toFixed(2)}</div></div>
                <div class="case-metric"><div class="case-metric-label">Case Wholesale</div><div class="case-metric-value">$${c.caseWholesale.toFixed(2)}</div></div>
                <div class="case-metric"><div class="case-metric-label">Case Discounted</div><div class="case-metric-value">$${c.caseDiscounted.toFixed(2)}</div></div>
                <div class="case-metric"><div class="case-metric-label"># of Items</div><div class="case-metric-value">${state.itemsPerCase}</div></div>
              </div>
            </div>

            <div class="status-row">
              <label for="f-status">Status</label>
              <select id="f-status" class="status-select status-${state.status.toLowerCase()}">
                <option value="Active" ${state.status === "Active" ? "selected" : ""}>Active</option>
                <option value="Inactive" ${state.status === "Inactive" ? "selected" : ""}>Inactive</option>
                <option value="Pending" ${state.status === "Pending" ? "selected" : ""}>Pending</option>
              </select>
            </div>
            <button class="push-btn" id="push-btn" style="margin-top:10px;" ${state.pushStatus === "loading" ? "disabled" : ""}>${state.pushStatus === "loading" ? "Pushing..." : `Push to Notion — ${state.status}`}</button>
            ${state.pushStatus === "success" ? `<div class="demo-note" style="color:var(--teal);">✓ ${state.pushMessage}</div>` : ""}
            ${state.pushStatus === "error" ? `<div class="demo-note" style="color:var(--gold);">${state.pushMessage}</div>` : ""}
            ${state.pushStatus === "" ? `<div class="demo-note">Writes directly to the Discount Guidelines database</div>` : ""}
          </div>
        </div>
      </div>
    `;

    attachHandlers();
  }

  function preserveFocus(id) {
    const el = document.getElementById(id);
    if (el) {
      el.focus();
      if (el.type === 'text') {
        const len = el.value.length;
        el.setSelectionRange(len, len);
      }
    }
  }

  function attachHandlers() {
    document.getElementById('f-itemNo').addEventListener('input', e => { state.itemNo = e.target.value; render(); preserveFocus('f-itemNo'); });
    document.getElementById('f-itemName').addEventListener('input', e => { state.itemName = e.target.value; render(); preserveFocus('f-itemName'); });
    document.getElementById('f-itemsPerCase').addEventListener('input', e => { state.itemsPerCase = e.target.value; render(); preserveFocus('f-itemsPerCase'); });
    document.getElementById('f-wholesalePrice').addEventListener('input', e => { state.wholesalePrice = e.target.value; render(); preserveFocus('f-wholesalePrice'); });
    document.getElementById('f-cost').addEventListener('input', e => { state.cost = e.target.value; render(); preserveFocus('f-cost'); });

    document.getElementById('f-weight').addEventListener('input', e => {
      state.weight = e.target.value;
      const w = parseFloat(state.weight) || 0;
      state.freight = (Math.round(w * FREIGHT_RATE * 100) / 100).toFixed(2);
      render(); preserveFocus('f-weight');
    });
    document.getElementById('f-freight').addEventListener('input', e => { state.freight = e.target.value; render(); preserveFocus('f-freight'); });

    document.getElementById('f-marketLow').addEventListener('input', e => { state.marketLow = e.target.value; render(); preserveFocus('f-marketLow'); });
    document.getElementById('f-marketHigh').addEventListener('input', e => { state.marketHigh = e.target.value; render(); preserveFocus('f-marketHigh'); });
    document.getElementById('f-srp').addEventListener('input', e => { state.srp = e.target.value; render(); preserveFocus('f-srp'); });
    document.getElementById('f-startDate').addEventListener('input', e => { state.startDate = e.target.value; });
    document.getElementById('f-endDate').addEventListener('input', e => { state.endDate = e.target.value; });
    document.getElementById('f-discount').addEventListener('input', e => { state.discountPct = e.target.value; render(); preserveFocus('f-discount'); });
    document.getElementById('f-availableFor').addEventListener('input', e => { state.availableFor = e.target.value; });
    document.getElementById('f-note').addEventListener('input', e => { state.note = e.target.value; });
    document.getElementById('f-status').addEventListener('change', e => { state.status = e.target.value; render(); });

    document.getElementById('push-btn').addEventListener('click', async () => {
      const c = calc();
      const payload = {
        "Item No": state.itemNo,
        "Item Name": state.itemName,
        "# of Items": c.itemsPerCase,
        "Wholesale Price": c.wholesalePrice,
        "Discount": c.discountPct / 100,
        "Discounted Price": Number(c.discountedPrice.toFixed(2)),
        "SRP": c.srp,
        "SRP Margin": Number((c.srpMargin).toFixed(4)),
        "Available for": state.availableFor,
        "Notes": state.note,
        "Status": state.status,
      };
      state.pushStatus = "loading";
      render();
      try {
        await pushToNotion(payload);
        state.pushStatus = "success";
        state.pushMessage = "Pushed to Discount Guidelines";
      } catch (err) {
        console.error(err);
        state.pushStatus = "error";
        state.pushMessage = "Push failed — check browser console for details";
      }
      render();
    });
  }

  render();
})();
</script>
